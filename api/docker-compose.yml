services:

  api:
    build: .
    container_name: bbt-chatbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/chatbot.db
    ports:
      - "5000:5000"
    volumes:
      # Volume persistente: sem ele o banco é apagado a cada deploy.
      - chatbot-data:/data

volumes:
  chatbot-data:
